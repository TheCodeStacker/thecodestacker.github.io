<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Code Stacker</title>
	<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.17/dist/index.global.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/marked@17.0.1/lib/marked.umd.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/feather-icons@4.29.2/dist/feather.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/country-flag-emoji@1.0.3/dist/country-flag-emoji.umd.min.js"></script>
	<script type="tailwind-config">
		{
			theme: {
				extend: {
					animation: {
						'fadeIn': 'fadeIn 0.3s ease-out',
						'slideInRight': 'slideInRight 0.3s ease-out',
						'slideInLeft': 'slideInLeft 0.3s ease-out',
						'scaleIn': 'scaleIn 0.3s ease-out',
						'spin': 'spin 1s linear infinite',
						'pulse': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite'
					},
					keyframes: {
						fadeIn: {
							'0%': { opacity: '0', transform: 'translateY(10px)' },
							'100%': { opacity: '1', transform: 'translateY(0)' }
						},
						slideInRight: {
							'0%': { opacity: '0', transform: 'translateX(20px)' },
							'100%': { opacity: '1', transform: 'translateX(0)' }
						},
						slideInLeft: {
							'0%': { opacity: '0', transform: 'translateX(-20px)' },
							'100%': { opacity: '1', transform: 'translateX(0)' }
						},
						scaleIn: {
							'0%': { opacity: '0', transform: 'scale(0.95)' },
							'100%': { opacity: '1', transform: 'scale(1)' }
						},
						spin: {
							'to': { transform: 'rotate(360deg)' }
						},
						pulse: {
							'0%, 100%': { opacity: '1' },
							'50%': { opacity: '0.5' }
						}
					}
				}
			}
		}
	</script>
</head>
<body class="bg-gray-50 min-h-screen scroll-smooth">
	<div class="container"></div>
	<script type="module" src="js/app.js"></script>
</body>
</html>
